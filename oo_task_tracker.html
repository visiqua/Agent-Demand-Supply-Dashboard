// ── Shared storage helpers ──────────────────────────────────────────────────
function loadTasks() { try { const s=localStorage.getItem(TASKS_KEY); return s?JSON.parse(s):DEFAULT_TASKS; } catch { return DEFAULT_TASKS; } }
function saveTasks(tasks) { try { localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); } catch {} }
function loadPinned() { try { const s=localStorage.getItem(PINNED_KEY); return s?JSON.parse(s):[]; } catch { return []; } }
function savePinned(pinned) { try { localStorage.setItem(PINNED_KEY, JSON.stringify(pinned)); } catch {} }

let nextLocalId = 1000;

function App() {
  const [tasks, setTasksRaw]   = useState(loadTasks);
  const [pinned, setPinnedRaw] = useState(loadPinned);
  const [selected, setSelected]   = useState(null);
  const [focusMode, setFocusMode] = useState(false);
  const [filterSection, setFilterSection]   = useState("All");
  const [filterStatus, setFilterStatus]     = useState("All");
  const [filterPriority, setFilterPriority] = useState("All");
  const [filterNoOwner, setFilterNoOwner]   = useState(false);
  const [search, setSearch]     = useState("");
  const [showAdd, setShowAdd]   = useState(false);
  const [newTask, setNewTask]   = useState({ name:"", notes:"", section:"New Product Builds", status:"Scoped", priority:"P1", owner:"" });
  const [editingOwner, setEditingOwner] = useState(null);
  const [ownerInput, setOwnerInput]     = useState("");

  function setTasks(next) { const v = typeof next==="function"?next(tasks):next; setTasksRaw(v); saveTasks(v); }
  function setPinned(next) { const v = typeof next==="function"?next(pinned):next; setPinnedRaw(v); savePinned(v); }

  // Listen for storage events from the agenda page (same-tab won't fire, but cross-tab will)
  useEffect(() => {
    function onStorage(e) {
      if (e.key===TASKS_KEY && e.newValue) { try { setTasksRaw(JSON.parse(e.newValue)); } catch {} }
      if (e.key===PINNED_KEY && e.newValue) { try { setPinnedRaw(JSON.parse(e.newValue)); } catch {} }
    }
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);

  function showToast(msg) { setToast(msg); setTimeout(()=>setToast(null), 2500); }

  function updateTask(id, patch) {
    setTasks(prev => prev.map(t=>(t.gid===id||t.id===id)?{...t,...patch}:t));
    if (selected?.gid===id||selected?.id===id) setSelected(s=>({...s,...patch}));
  }
  function addTask() {
    if (!newTask.name.trim()) return;
    setTasks(prev=>[{...newTask,id:`local-${nextLocalId++}`,gid:null},...prev]);
    setShowAdd(false); setNewTask({name:"",notes:"",section:"New Product Builds",status:"Scoped",priority:"P1",owner:""});
    showToast("Task added & synced");
  }
  function applyPresenterFilter(f) { setFilterSection(f.section);setFilterPriority(f.priority);setFilterStatus(f.status);setFilterNoOwner(f.noOwner||false);setSearch(""); }
  function togglePin(id) {
    setPinned(prev=>prev.includes(id)?prev.filter(p=>p!==id):[...prev,id]);
    showToast(pinned.includes(id)?"Unpinned — removed from agenda focus":"📌 Pinned — will appear in agenda This Week's Focus");
  }
  const tid = t=>t.gid||t.id;

  const filtered = useMemo(()=>{
    let list = tasks.filter(t=>{
      if (filterSection!=="All"&&t.section!==filterSection) return false;
      if (filterStatus!=="All"&&t.status!==filterStatus) return false;
      if (filterPriority!=="All"&&t.priority!==filterPriority) return false;
      if (filterNoOwner&&t.owner&&t.owner.trim()) return false;
      const q=search.toLowerCase();
      return !q||t.name.toLowerCase().includes(q)||(t.notes||"").toLowerCase().includes(q);
    });
    const pinnedT=list.filter(t=>pinned.includes(tid(t)));
    const rest=list.filter(t=>!pinned.includes(tid(t)));
    return [...pinnedT,...rest];
  },[tasks,filterSection,filterStatus,filterPriority,filterNoOwner,search,pinned]);

  const grouped = useMemo(()=>{ const m={}; filtered.forEach(t=>{if(!m[t.section])m[t.section]=[];m[t.section].push(t);}); return m; },[filtered]);
  const sectionCounts = useMemo(()=>{ const c={}; tasks.forEach(t=>{c[t.section]=(c[t.section]||0)+1;}); return c; },[tasks]);
  const stats = { total:tasks.length, pinned:pinned.length, p0:tasks.filter(t=>t.priority==="P0").length, inProgress:tasks.filter(t=>t.status==="In Progress").length, noOwner:tasks.filter(t=>!t.owner||!t.owner.trim()).length };

  function handleExport() {

    const blob=new Blob([lines.join("\n")],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`oo-initiatives-${Date.now()}.txt`;a.click();
  }

  // ── Focus mode ────────────────────────────────────────────────────────────
  if (focusMode&&selected) {
    const sm=STATUS_META[selected.status]||STATUS_META["In Progress"];
    const pm=PRIORITY_META[selected.priority]||PRIORITY_META.P2;

      <div style={{minHeight:"100vh",background:"#f9fafb",fontFamily:"'Inter',-apple-system,sans-serif",display:"flex",flexDirection:"column"}}>

          </div>
        </div>
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:48}}>

              <span style={{fontSize:12,fontWeight:500,padding:"4px 12px",borderRadius:10,background:sm.bg,color:sm.color}}>● {selected.status}</span>
              {selected.owner&&<span style={{fontSize:12,color:"#4f46e5",background:"#eef2ff",padding:"4px 12px",borderRadius:10}}>👤 {selected.owner}</span>}
              {pinned.includes(tid(selected))&&<span style={{fontSize:12,color:"#d97706",background:"#fef3c7",padding:"4px 12px",borderRadius:10}}>📌 In Agenda</span>}
            </div>
            <div style={{fontSize:28,fontWeight:700,color:"#111827",lineHeight:1.3,marginBottom:28,fontFamily:"'Syne',sans-serif"}}>{selected.name}</div>
            {selected.notes&&<div style={{fontSize:14,color:"#374151",lineHeight:1.8,background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:10,padding:"20px 24px",whiteSpace:"pre-wrap"}}>{selected.notes}</div>}
            {selected.gid&&<a href={`https://app.asana.com/0/${PROJECT_GID}/${selected.gid}`} target="_blank" style={{display:"inline-block",marginTop:20,fontSize:12,color:"#4f46e5",fontWeight:500}}>↗ Open in Asana</a>}
          </div>
        </div>
        <div style={{background:"#fff",borderTop:"1px solid #e5e7eb",padding:"12px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <button onClick={()=>{if(idx>0)setSelected(filtered[idx-1]);}} style={{background:"#f3f4f6",border:"none",borderRadius:6,padding:"7px 16px",fontSize:12,cursor:"pointer",fontWeight:500}}>← Prev</button>
          <span style={{fontSize:11,color:"#9ca3af"}}>{idx+1} of {filtered.length}</span>
          <button onClick={()=>{if(idx<filtered.length-1)setSelected(filtered[idx+1]);}} style={{background:"#f3f4f6",border:"none",borderRadius:6,padding:"7px 16px",fontSize:12,cursor:"pointer",fontWeight:500}}>Next →</button>
        </div>
      </div>
    );
  }

  // ── Main view ─────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:"100vh",background:"#f9fafb",fontFamily:"'Inter',-apple-system,sans-serif",color:"#111827"}}>
      {toast&&<div style={{position:"fixed",top:16,right:16,zIndex:999,background:"#1a1a1a",color:"#fff",borderRadius:8,padding:"10px 16px",fontSize:12,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",maxWidth:320}}>{toast}</div>}

      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:30,height:30,background:"#4f46e5",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:13,fontFamily:"'Syne',sans-serif",fontWeight:800}}>V</span></div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#111827",fontFamily:"'Syne',sans-serif"}}>Visiqua / O&O Initiatives</div>
            <div style={{fontSize:10,color:"#9ca3af"}}>Asana · {tasks.length} tasks · {pinned.length} pinned to agenda</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="hov" onClick={handleExport} style={{background:"#fff",color:"#374151",border:"1px solid #e5e7eb",borderRadius:6,padding:"6px 12px",fontSize:11,cursor:"pointer",fontWeight:500}}>⬇ Export</button>
          <a href={`https://app.asana.com/0/${PROJECT_GID}/list`} target="_blank" style={{background:"#fff",color:"#4f46e5",border:"1px solid #e0e7ff",borderRadius:6,padding:"6px 12px",fontSize:11,fontWeight:500}}>↗ Asana</a>
          <a href="https://visiqua.github.io/Agent-Demand-Supply-Dashboard/oo_wednesday_agenda.html" target="_blank" style={{background:"#0891b2",color:"#fff",border:"none",borderRadius:6,padding:"6px 12px",fontSize:11,fontWeight:500}}>📋 Agenda</a>
          <button className="hov" onClick={()=>setShowAdd(true)} style={{background:"#4f46e5",color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",fontSize:11,cursor:"pointer",fontWeight:500}}>+ New Task</button>
        </div>
      </div>

      {/* Quick filters */}
      <div style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"8px 20px",display:"flex",gap:6,alignItems:"center",overflowX:"auto"}}>
        <span style={{fontSize:10,color:"#9ca3af",fontWeight:600,letterSpacing:"0.06em",whiteSpace:"nowrap",marginRight:4}}>QUICK FILTER</span>
        {PRESENTER_FILTERS.map(f=><button key={f.label} className="pf-btn" onClick={()=>applyPresenterFilter(f)} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:500,color:"#374151",whiteSpace:"nowrap"}}>{f.label}</button>)}
        <button className="pf-btn" onClick={()=>{setFilterSection("All");setFilterPriority("All");setFilterStatus("All");setFilterNoOwner(false);setSearch("");}} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:500,color:"#6b7280"}}>✕ Clear</button>
        {pinned.length>0&&<button className="pf-btn" onClick={()=>applyPresenterFilter({section:"All",priority:"All",status:"All",noOwner:false})} style={{background:"#fef3c7",border:"1px solid #fbbf24",borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600,color:"#d97706",whiteSpace:"nowrap"}}>📌 In Agenda ({pinned.length})</button>}
      </div>

      {/* Stats */}
      <div style={{background:"#fff",borderBottom:"1px solid #e5e7eb",display:"flex"}}>
        {[{l:"Total",v:stats.total,c:"#111827"},{l:"📌 In Agenda",v:stats.pinned,c:"#d97706"},{l:"P0 Critical",v:stats.p0,c:"#dc2626"},{l:"In Progress",v:stats.inProgress,c:"#d97706"},{l:"Needs Owner",v:stats.noOwner,c:"#7c3aed"}].map(s=>(
          <div key={s.l} style={{flex:1,padding:"10px 16px",borderRight:"1px solid #f3f4f6"}}>
            <div style={{fontSize:20,fontWeight:700,color:s.c,fontFamily:"'Syne',sans-serif"}}>{s.v}</div>
            <div style={{fontSize:9,color:"#9ca3af",letterSpacing:"0.06em",marginTop:1,textTransform:"uppercase",fontWeight:500}}>{s.l}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex",height:"calc(100vh - 166px)"}}>
        {/* Sidebar */}
        <div style={{width:190,borderRight:"1px solid #e5e7eb",background:"#fff",padding:"10px 0",overflowY:"auto",flexShrink:0}}>
          <div style={{padding:"0 10px 10px"}}><input placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,fontSize:11}} /></div>
          {[{heading:"Section",opts:SECTIONS_LIST,active:filterSection,set:setFilterSection},{heading:"Status",opts:["All",...Object.keys(STATUS_META)],active:filterStatus,set:setFilterStatus},{heading:"Priority",opts:["All","P0","P1","P2","P3"],active:filterPriority,set:setFilterPriority}].map(g=>(
            <div key={g.heading} style={{marginBottom:4}}>
              <div style={{padding:"8px 14px 3px",fontSize:9,color:"#9ca3af",letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600}}>{g.heading}</div>
              {g.opts.map(o=>{const active=g.active===o;const accent=STATUS_META[o]?.color||PRIORITY_META[o]?.color||"#4f46e5";const activeBg=STATUS_META[o]?.bg||PRIORITY_META[o]?.bg||"#eef2ff";return <div key={o} className="sidebar-item" onClick={()=>g.set(o)} style={{padding:"5px 14px",fontSize:11,display:"flex",justifyContent:"space-between",alignItems:"center",color:active?accent:"#374151",fontWeight:active?600:400,background:active?activeBg:"transparent",borderLeft:active?`3px solid ${accent}`:"3px solid transparent"}}><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o==="All"?`All ${g.heading}s`:o}</span>{g.heading==="Section"&&o!=="All"&&sectionCounts[o]&&<span style={{fontSize:9,color:"#9ca3af",background:"#f3f4f6",borderRadius:10,padding:"1px 5px",flexShrink:0,marginLeft:3}}>{sectionCounts[o]}</span>}</div>;})}
            </div>
          ))}
        </div>

        {/* Task list */}
        <div style={{flex:1,overflowY:"auto",padding:"14px 16px",background:"#f9fafb"}}>
          <div style={{fontSize:10,color:"#9ca3af",marginBottom:10,fontWeight:500,letterSpacing:"0.04em",textTransform:"uppercase"}}>{filtered.length} tasks</div>
          {Object.entries(grouped).map(([sec,items])=>(
            <div key={sec} style={{marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:"#374151",letterSpacing:"0.04em",textTransform:"uppercase"}}>{sec}</div>
                <div style={{flex:1,height:1,background:"#e5e7eb"}} />
                <div style={{fontSize:10,color:"#9ca3af",background:"#f3f4f6",borderRadius:10,padding:"1px 7px"}}>{items.length}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {items.map(task=>{
                  const sm=STATUS_META[task.status]||STATUS_META["In Progress"];
                  const pm=PRIORITY_META[task.priority]||PRIORITY_META.P2;
                  const isPinned=pinned.includes(tid(task));
                  const isNew=task.section==="New Product Builds";
                  return (
                    <div key={tid(task)} className="card" style={{background:isPinned?"#fffbeb":"#fff",border:isPinned?"1px solid #fbbf24":"1px solid #e5e7eb",borderRadius:8,padding:"10px 14px",borderLeft:`3px solid ${pm.color}`,animation:"fadein 0.15s ease"}}>
                      <div style={{display:"flex",alignItems:"flex-start",gap:10,justifyContent:"space-between"}}>
                        <div style={{flex:1,minWidth:0}} onClick={()=>setSelected(task)}>
                          <div style={{display:"flex",gap:5,alignItems:"center",marginBottom:3,flexWrap:"wrap"}}>
                            <span style={{fontSize:10,fontWeight:600,color:pm.color,background:pm.bg,padding:"1px 7px",borderRadius:10}}>{task.priority}</span>
                            {isNew&&<span style={{fontSize:9,fontWeight:600,padding:"1px 6px",borderRadius:10,background:"#eef2ff",color:"#4f46e5"}}>NEW</span>}
                            {isPinned&&<span style={{fontSize:9,fontWeight:600,padding:"1px 6px",borderRadius:10,background:"#fef3c7",color:"#d97706"}}>📌 AGENDA</span>}
                            {task.owner&&<span style={{fontSize:10,color:"#6b7280"}}>👤 {task.owner}</span>}
                            {!task.owner&&<span style={{fontSize:10,color:"#dc2626",background:"#fee2e2",padding:"1px 6px",borderRadius:10,cursor:"pointer"}} onClick={e=>{e.stopPropagation();setEditingOwner(tid(task));setOwnerInput("");}}>+ owner</span>}
                          </div>
                          <div style={{fontSize:13,fontWeight:600,color:"#111827",marginBottom:task.notes?2:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{task.name}</div>
                          {task.notes&&<div style={{fontSize:11,color:"#6b7280",lineHeight:1.5}}>{task.notes.split("\n")[0].slice(0,85)}{task.notes.length>85?"…":""}</div>}
                        </div>
                        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                          <span style={{fontSize:10,fontWeight:500,padding:"2px 9px",borderRadius:10,background:sm.bg,color:sm.color,whiteSpace:"nowrap"}}>● {task.status}</span>
                          <div style={{display:"flex",gap:4}}>
                            <button title={isPinned?"Unpin from agenda":"Pin to agenda — appears in This Week's Focus"} onClick={e=>{e.stopPropagation();togglePin(tid(task));}} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,opacity:isPinned?1:0.25,padding:"2px 4px",transition:"opacity 0.15s"}}>📌</button>
                            <button className="hov" onClick={e=>{e.stopPropagation();setSelected(task);setFocusMode(true);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,opacity:0.4,padding:"2px 4px"}}>⛶</button>
                          </div>
                        </div>
                      </div>
                      {editingOwner===tid(task)&&(
                        <div style={{marginTop:8,display:"flex",gap:6}} onClick={e=>e.stopPropagation()}>
                          <input autoFocus value={ownerInput} onChange={e=>setOwnerInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){updateTask(tid(task),{owner:ownerInput});setEditingOwner(null);}if(e.key==="Escape")setEditingOwner(null);}} placeholder="Assign owner…" style={{...inp,fontSize:11,padding:"4px 8px",flex:1}} />
                          <button onClick={()=>{updateTask(tid(task),{owner:ownerInput});setEditingOwner(null);}} style={{background:"#4f46e5",color:"#fff",border:"none",borderRadius:5,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>Save</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>

        {/* Detail panel */}
        {selected&&!focusMode&&(
          <div style={{width:340,borderLeft:"1px solid #e5e7eb",overflowY:"auto",padding:"18px",background:"#fff",animation:"fadein 0.15s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                <span style={{fontSize:10,fontWeight:600,color:PRIORITY_META[selected.priority]?.color,background:PRIORITY_META[selected.priority]?.bg,padding:"2px 8px",borderRadius:10}}>{selected.priority}</span>
                <span style={{fontSize:10,color:"#6b7280",background:"#f3f4f6",padding:"2px 8px",borderRadius:10}}>{selected.section}</span>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setFocusMode(true)} style={{background:"#eef2ff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",color:"#4f46e5",fontWeight:500}}>⛶ Focus</button>
                <button className="hov" onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"#9ca3af",fontSize:18,cursor:"pointer"}}>×</button>
              </div>
            </div>
            <div style={{fontSize:15,fontWeight:700,color:"#111827",lineHeight:1.4,marginBottom:12,fontFamily:"'Syne',sans-serif"}}>{selected.name}</div>
            {selected.gid&&<a href={`https://app.asana.com/0/${PROJECT_GID}/${selected.gid}`} target="_blank" style={{fontSize:11,color:"#4f46e5",fontWeight:500,display:"block",marginBottom:14}}>↗ Open in Asana</a>}
            <div style={{marginBottom:14}}>
              <span style={lbl}>Owner</span>
              {editingOwner===tid(selected)?(
                <div style={{display:"flex",gap:6}}>
                  <input autoFocus value={ownerInput} onChange={e=>setOwnerInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){updateTask(tid(selected),{owner:ownerInput});setEditingOwner(null);}if(e.key==="Escape")setEditingOwner(null);}} style={{...inp,fontSize:12,flex:1}} />
                  <button onClick={()=>{updateTask(tid(selected),{owner:ownerInput});setEditingOwner(null);}} style={{background:"#4f46e5",color:"#fff",border:"none",borderRadius:5,padding:"6px 10px",fontSize:11,cursor:"pointer"}}>Save</button>
                </div>
              ):(
                <div onClick={()=>{setEditingOwner(tid(selected));setOwnerInput(selected.owner||"");}} style={{fontSize:13,color:selected.owner?"#111827":"#9ca3af",cursor:"pointer",background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:6,padding:"7px 11px"}}>{selected.owner||"Click to assign…"}</div>
              )}
            </div>
            <div style={{marginBottom:14}}>
              <span style={lbl}>Status</span>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {Object.keys(STATUS_META).map(st=>{const m=STATUS_META[st];const active=selected.status===st;return <span key={st} className="hov" onClick={()=>updateTask(tid(selected),{status:st})} style={{fontSize:11,fontWeight:500,padding:"4px 10px",borderRadius:10,cursor:"pointer",background:active?m.bg:"#f9fafb",color:active?m.color:"#6b7280",border:`1px solid ${active?m.color+"33":"#e5e7eb"}`}}>● {st}</span>;})}
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <span style={lbl}>Priority</span>
              <div style={{display:"flex",gap:5}}>
                {["P0","P1","P2","P3"].map(p=>{const active=selected.priority===p;const m=PRIORITY_META[p];return <span key={p} className="hov" onClick={()=>updateTask(tid(selected),{priority:p})} style={{fontSize:11,fontWeight:600,padding:"4px 10px",borderRadius:10,cursor:"pointer",background:active?m.bg:"#f9fafb",color:active?m.color:"#6b7280",border:`1px solid ${active?m.color+"33":"#e5e7eb"}`}}>{p}</span>;})}
              </div>
            </div>
            {selected.notes&&<div style={{marginBottom:14}}><span style={lbl}>Notes</span><div style={{fontSize:12,color:"#374151",lineHeight:1.7,background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:"12px 14px",maxHeight:200,overflowY:"auto",whiteSpace:"pre-wrap"}}>{selected.notes}</div></div>}
            <button onClick={()=>togglePin(tid(selected))} style={{background:pinned.includes(tid(selected))?"#fef3c7":"#f9fafb",border:`1px solid ${pinned.includes(tid(selected))?"#fbbf24":"#e5e7eb"}`,borderRadius:6,padding:"8px 14px",fontSize:11,cursor:"pointer",fontWeight:500,color:pinned.includes(tid(selected))?"#d97706":"#6b7280",width:"100%",marginBottom:8}}>
              {pinned.includes(tid(selected))?"📌 Pinned — In Agenda This Week's Focus":"📌 Pin to Agenda This Week's Focus"}
            </button>
            <div style={{fontSize:10,color:"#9ca3af",textAlign:"center"}}>Pinned items auto-appear in the Wednesday Agenda</div>
          </div>
        )}
      </div>

      {/* Add modal */}
      {showAdd&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:12,padding:24,width:"100%",maxWidth:520,boxShadow:"0 20px 60px rgba(0,0,0,0.15)"}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:18,fontFamily:"'Syne',sans-serif"}}>New Task</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div><label style={lbl}>Title *</label><input value={newTask.name} onChange={e=>setNewTask({...newTask,name:e.target.value})} style={inp} placeholder="Task name" /></div>
              <div><label style={lbl}>Owner</label><input value={newTask.owner} onChange={e=>setNewTask({...newTask,owner:e.target.value})} style={inp} /></div>
              <div><label style={lbl}>Notes</label><textarea value={newTask.notes} onChange={e=>setNewTask({...newTask,notes:e.target.value})} rows={3} style={{...inp,fontFamily:"inherit"}} /></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                {[{k:"section",opts:SECTIONS_LIST.filter(s=>s!=="All")},{k:"priority",opts:["P0","P1","P2","P3"]},{k:"status",opts:Object.keys(STATUS_META)}].map(f=>(
                  <div key={f.k}><label style={lbl}>{f.k}</label><select value={newTask[f.k]} onChange={e=>setNewTask({...newTask,[f.k]:e.target.value})} style={{...inp,cursor:"pointer"}}>{f.opts.map(o=><option key={o}>{o}</option>)}</select></div>
                ))}
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:20}}>
              <button className="hov" onClick={addTask} style={{background:"#4f46e5",color:"#fff",border:"none",borderRadius:6,padding:"9px 22px",fontSize:12,cursor:"pointer",fontWeight:500}}>Add Task</button>
              <button className="hov" onClick={()=>setShowAdd(false)} style={{background:"#fff",color:"#6b7280",border:"1px solid #e5e7eb",borderRadius:6,padding:"9px 22px",fontSize:12,cursor:"pointer"}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
