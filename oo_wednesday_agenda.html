<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visiqua — Wednesday Meeting</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fafaf8;font-family:'Spectral',Georgia,serif;color:#1a1a1a;}
  ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideup{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  .item-row:hover .del-btn{opacity:1!important;}
  .nav-item:hover{background:#f3f4f6!important;}
  .nav-item.active-nav{background:#1a1a1a!important;color:#fff!important;}
  .tool-chip:hover{opacity:0.8;}
  .check-btn:hover{border-color:#1a1a1a!important;}
  .add-btn:hover{background:#1a1a1a!important;color:#fff!important;}
  .export-btn:hover{background:#1a1a1a!important;color:#fff!important;}
  a{text-decoration:none;}
  textarea{font-family:'Spectral',Georgia,serif;}
  input{font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const STORAGE_KEY = "visiqua_agenda_v1";

const TASK_TRACKER_URL = "https://visiqua.github.io/Agent-Demand-Supply-Dashboard/oo_task_tracker.html";
const AGENT_DASH_URL = "https://visiqua.github.io/Agent-Demand-Supply-Dashboard/visiqua_agent_map.html";
const CHANNEL_DASH_URL = "https://visiqua.github.io/Agent-Demand-Supply-Dashboard/local_hero_channel_scorecard_51926.html";

const SECTION_DEFS = [
  { id:"opening",   label:"Opening",              icon:"📋", color:"#0891b2", bg:"#cffafe", border:"#67e8f9", description:"Team updates, announcements, and one-time items", tool:null,            timebox:"5 min" },
  { id:"focus",     label:"This Week's Focus",     icon:"⚡", color:"#d97706", bg:"#fef3c7", border:"#fbbf24", description:"3–5 pinned items from the O&O task tracker",    tool:"O&O Task Tracker", toolUrl:TASK_TRACKER_URL, timebox:"15 min" },
  { id:"oo",        label:"O&O Performance",       icon:"📊", color:"#2563eb", bg:"#dbeafe", border:"#93c5fd", description:"Channel-level metrics from the O&O dashboard",   tool:"O&O Channel Dashboard", toolUrl:CHANNEL_DASH_URL, timebox:"10 min" },
  { id:"act",       label:"ACT Agent Program",     icon:"🤝", color:"#059669", bg:"#d1fae5", border:"#6ee7b7", description:"Rep performance & agent health",                  tool:"ACT Agent Dashboard", toolUrl:AGENT_DASH_URL, timebox:"20 min" },
  { id:"decisions", label:"Decisions Needed",      icon:"🎯", color:"#7c3aed", bg:"#ede9fe", border:"#c4b5fd", description:"Anything that needs a yes/no before we leave",   tool:null,            timebox:"10 min" },
  { id:"actions",   label:"Action Items",          icon:"✅", color:"#374151", bg:"#f3f4f6", border:"#d1d5db", description:"Captured live — push to Asana after the meeting", tool:null,            timebox:"5 min" },
];

const DEFAULT_ITEMS = {
  opening:   [{ id:"o1", text:"Mark joins the team next Tuesday — welcome & intro", done:false }, { id:"o2", text:"Hannah's replacement — interview process update", done:false }],
  focus:     [{ id:"f1", text:"[FILTER] Current Carrier Detection — scoping update", done:false, tag:"P0" }, { id:"f2", text:"[ROUTING] Intelligent Call Routing Engine — owner assignment needed", done:false, tag:"P0" }, { id:"f3", text:"AgencyZoom Integration — Farmers WA/OR status", done:false, tag:"P0" }, { id:"f4", text:"Marco Agent Flow — call volume toward Q4 target", done:false, tag:"P1" }],
  oo:        [{ id:"oo1", text:"Call volume vs. last week", done:false }, { id:"oo2", text:"C2B rate & return rate trends", done:false }, { id:"oo3", text:"Top performing sub-IDs", done:false }, { id:"oo4", text:"Budget pacing by channel", done:false }],
  act:       [{ id:"a1", text:"Brittany book — active rate & top movers", done:false }, { id:"a2", text:"Stacy book — active rate & top movers", done:false }, { id:"a3", text:"New activations this week", done:false }, { id:"a4", text:"Dormant agent flags / churn risk", done:false }, { id:"a5", text:"Farmers (Doug Runyon) — lead volume & dispo status", done:false }],
  decisions: [],
  actions:   [],
};

function getMeetingDate() {
  const now = new Date();
  const day = now.getDay();
  const diff = day <= 3 ? (3 - day) : (10 - day);
  const next = new Date(now); next.setDate(now.getDate() + diff);
  return next.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });
}

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (!s) return null;
    const parsed = JSON.parse(s);
    // Reset if it's a new week (Monday resets)
    const savedDate = parsed.date;
    const today = new Date().toDateString();
    if (savedDate !== today && new Date().getDay() === 1) return null;
    return parsed;
  } catch { return null; }
}

function saveState(sections, attendees, notes) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ sections, attendees, notes, date: new Date().toDateString() })); } catch {}
}

let nid = 500;

function App() {
  const saved = loadState();
  const [sections, setSections] = useState(() =>
    SECTION_DEFS.map(def => ({
      ...def,
      items: saved?.sections?.find(s=>s.id===def.id)?.items || DEFAULT_ITEMS[def.id] || [],
      notes: saved?.sections?.find(s=>s.id===def.id)?.notes || "",
    }))
  );
  const [active, setActive] = useState("opening");
  const [attendees, setAttendees] = useState(saved?.attendees || "");
  const [meetingNotes, setMeetingNotes] = useState(saved?.notes || "");
  const [newItemText, setNewItemText] = useState({});
  const [editingId, setEditingId] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [showClear, setShowClear] = useState(false);

  useEffect(() => { saveState(sections, attendees, meetingNotes); }, [sections, attendees, meetingNotes]);

  function updateSection(id, patch) { setSections(prev => prev.map(s => s.id===id ? { ...s, ...patch } : s)); }
  function toggleItem(sId, iId) { setSections(prev => prev.map(s => s.id===sId ? { ...s, items: s.items.map(i => i.id===iId ? { ...i, done:!i.done } : i) } : s)); }
  function removeItem(sId, iId) { setSections(prev => prev.map(s => s.id===sId ? { ...s, items: s.items.filter(i => i.id!==iId) } : s)); }
  function updateItemText(sId, iId, text) { setSections(prev => prev.map(s => s.id===sId ? { ...s, items: s.items.map(i => i.id===iId ? { ...i, text } : i) } : s)); }
  function addItem(sId) {
    const text = (newItemText[sId]||"").trim(); if(!text) return;
    setSections(prev => prev.map(s => s.id===sId ? { ...s, items:[...s.items,{ id:`n${nid++}`, text, done:false }] } : s));
    setNewItemText(p => ({...p,[sId]:""}));
  }
  function clearMeeting() {
    setSections(SECTION_DEFS.map(def => ({ ...def, items: DEFAULT_ITEMS[def.id]||[], notes:"" })));
    setAttendees(""); setMeetingNotes(""); setShowClear(false);
  }

  const activeSection = sections.find(s=>s.id===active);
  const totalDone = sections.reduce((a,s)=>a+s.items.filter(i=>i.done).length,0);
  const totalItems = sections.reduce((a,s)=>a+s.items.length,0);

  function generateExport() {
    const lines = [`VISIQUA — WEDNESDAY STATUS MEETING`, getMeetingDate(), attendees ? `Attendees: ${attendees}` : "", "", "─".repeat(60)];
    sections.forEach(s => {
      lines.push("", `${s.icon}  ${s.label.toUpperCase()}  [${s.timebox}]`, "─".repeat(40));
      s.items.forEach(i => { const tag = i.tag ? ` [${i.tag}]` : ""; lines.push(`  ${i.done?"✓":"○"} ${i.text}${tag}`); });
      if (s.notes) lines.push("", `  Notes: ${s.notes}`);
    });
    if (meetingNotes) lines.push("", "─".repeat(60), "GENERAL NOTES", meetingNotes);
    const actions = sections.find(s=>s.id==="actions");
    if (actions?.items.length) { lines.push("", "─".repeat(60), "ACTION ITEMS — PUSH TO ASANA"); actions.items.forEach((i,n)=>lines.push(`  ${n+1}. ${i.text}`)); }
    return lines.join("\n");
  }

  const mono = { fontFamily:"'JetBrains Mono',monospace" };
  const serif = { fontFamily:"'Spectral',Georgia,serif" };

  return (
    <div style={{ minHeight:"100vh", background:"#fafaf8", ...serif, color:"#1a1a1a" }}>

      {/* Top bar */}
      <div style={{ background:"#1a1a1a", color:"#fff", padding:"0 24px", display:"flex", alignItems:"center", justifyContent:"space-between", height:50 }}>
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ ...mono, fontSize:10, color:"#6b7280", letterSpacing:"0.12em" }}>VISIQUA</div>
          <div style={{ width:1, height:14, background:"#374151" }} />
          <div style={{ fontSize:14, fontWeight:600 }}>Wednesday Status Meeting</div>
          <div style={{ ...mono, fontSize:10, color:"#6b7280" }}>{getMeetingDate()}</div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ ...mono, fontSize:10, color:"#6b7280" }}>{totalDone}/{totalItems}</div>
          <div style={{ width:72, height:3, background:"#374151", borderRadius:2 }}>
            <div style={{ width:`${totalItems?(totalDone/totalItems)*100:0}%`, height:"100%", background:"#10b981", borderRadius:2, transition:"width 0.3s" }} />
          </div>
          <button onClick={()=>setShowClear(true)} style={{ ...mono, background:"transparent", color:"#6b7280", border:"1px solid #374151", borderRadius:5, padding:"4px 10px", fontSize:10, cursor:"pointer", letterSpacing:"0.06em" }}>NEW WEEK</button>
          <button className="export-btn" onClick={()=>setShowExport(true)} style={{ ...mono, background:"transparent", color:"#9ca3af", border:"1px solid #374151", borderRadius:5, padding:"4px 10px", fontSize:10, cursor:"pointer", letterSpacing:"0.06em", transition:"all 0.15s" }}>EXPORT</button>
        </div>
      </div>

      <div style={{ display:"flex", height:"calc(100vh - 50px)" }}>

        {/* Sidebar */}
        <div style={{ width:216, borderRight:"1px solid #e5e7eb", background:"#fff", padding:"16px 0", display:"flex", flexDirection:"column" }}>

          {/* Tool links */}
          <div style={{ padding:"0 14px 14px", borderBottom:"1px solid #f3f4f6" }}>
            <div style={{ ...mono, fontSize:9, color:"#9ca3af", letterSpacing:"0.1em", marginBottom:8 }}>DASHBOARDS</div>
            {[
              { label:"O&O Task Tracker", color:"#4f46e5", url:TASK_TRACKER_URL },
              { label:"ACT Agent Dashboard", color:"#059669", url:AGENT_DASH_URL },
              { label:"O&O Channel Dashboard", color:"#2563eb", url:CHANNEL_DASH_URL },
            ].map(t => (
              <a key={t.label} href={t.url} target="_blank" rel="noreferrer" className="tool-chip" style={{ display:"flex", alignItems:"center", gap:7, padding:"5px 6px", borderRadius:5, marginBottom:2 }}>
                <div style={{ width:6, height:6, borderRadius:"50%", background:t.color, flexShrink:0 }} />
                <span style={{ ...mono, fontSize:10, color:t.color, fontWeight:500 }}>{t.label} ↗</span>
              </a>
            ))}
          </div>

          {/* Nav */}
          <div style={{ flex:1, overflowY:"auto", padding:"10px 0" }}>
            <div style={{ ...mono, padding:"0 14px 6px", fontSize:9, color:"#9ca3af", letterSpacing:"0.1em" }}>AGENDA</div>
            {sections.map(s => {
              const done = s.items.filter(i=>i.done).length;
              const isActive = active===s.id;
              return (
                <div key={s.id} className={`nav-item${isActive?" active-nav":""}`} onClick={()=>setActive(s.id)} style={{
                  padding:"9px 14px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"space-between",
                  borderLeft: isActive ? `3px solid ${s.color}` : "3px solid transparent", transition:"all 0.12s",
                }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:13 }}>{s.icon}</span>
                    <div>
                      <div style={{ fontSize:12, fontWeight:600 }}>{s.label}</div>
                      <div style={{ ...mono, fontSize:9, color:isActive?"#9ca3af":"#9ca3af", marginTop:1 }}>{s.timebox}</div>
                    </div>
                  </div>
                  {s.items.length > 0 && <div style={{ ...mono, fontSize:10, color:isActive?"#9ca3af":"#9ca3af", flexShrink:0 }}>{done}/{s.items.length}</div>}
                </div>
              );
            })}
          </div>

          {/* Attendees */}
          <div style={{ padding:"10px 14px", borderTop:"1px solid #f3f4f6" }}>
            <div style={{ ...mono, fontSize:9, color:"#9ca3af", letterSpacing:"0.1em", marginBottom:5 }}>ATTENDEES</div>
            <textarea value={attendees} onChange={e=>setAttendees(e.target.value)} placeholder="Names…" rows={2} style={{ width:"100%", fontSize:11, border:"1px solid #e5e7eb", borderRadius:5, padding:"5px 7px", color:"#374151", outline:"none", background:"#fafaf8", resize:"none", ...serif }} />
          </div>
        </div>

        {/* Main */}
        {activeSection && (
          <div key={activeSection.id} style={{ flex:1, overflowY:"auto", padding:"28px 36px", animation:"fadein 0.2s ease" }}>

            {/* Section header */}
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:24 }}>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:5 }}>
                  <span style={{ fontSize:20 }}>{activeSection.icon}</span>
                  <h1 style={{ fontSize:24, fontWeight:700, letterSpacing:"-0.02em" }}>{activeSection.label}</h1>
                  <span style={{ ...mono, fontSize:10, color:"#9ca3af", background:"#f3f4f6", padding:"3px 8px", borderRadius:4 }}>{activeSection.timebox}</span>
                </div>
                <p style={{ fontSize:13, color:"#6b7280", fontStyle:"italic" }}>{activeSection.description}</p>
                {activeSection.tool && activeSection.toolUrl && (
                  <div style={{ marginTop:8, display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ ...mono, fontSize:9, color:"#9ca3af" }}>TOOL →</span>
                    <a href={activeSection.toolUrl} target="_blank" rel="noreferrer" style={{ ...mono, fontSize:10, color:activeSection.color, background:activeSection.bg, padding:"3px 10px", borderRadius:4, border:`1px solid ${activeSection.border}`, fontWeight:500 }}>
                      {activeSection.tool} ↗
                    </a>
                  </div>
                )}
              </div>
              <div style={{ ...mono, fontSize:11, color:"#9ca3af", textAlign:"right", flexShrink:0, marginLeft:20 }}>
                {activeSection.items.filter(i=>i.done).length} / {activeSection.items.length}<br/>
                <span style={{ fontSize:9 }}>covered</span>
              </div>
            </div>

            {/* Divider */}
            <div style={{ height:1, background:`linear-gradient(to right, ${activeSection.color}55, transparent)`, marginBottom:20 }} />

            {/* Items */}
            <div style={{ display:"flex", flexDirection:"column", gap:5, marginBottom:20 }}>
              {activeSection.items.map(item => (
                <div key={item.id} className="item-row" style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"9px 12px", background:item.done?"#f9fafb":"#fff", border:`1px solid ${item.done?"#f3f4f6":"#e5e7eb"}`, borderRadius:7, transition:"all 0.12s", borderLeft:item.done?"3px solid #10b981":`3px solid ${activeSection.color}` }}>
                  <button className="check-btn" onClick={()=>toggleItem(activeSection.id,item.id)} style={{ width:17, height:17, borderRadius:4, border:`1.5px solid ${item.done?"#10b981":"#d1d5db"}`, background:item.done?"#10b981":"transparent", cursor:"pointer", flexShrink:0, marginTop:2, display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.12s" }}>
                    {item.done && <span style={{ color:"#fff", fontSize:9, lineHeight:1 }}>✓</span>}
                  </button>
                  <div style={{ flex:1 }}>
                    {editingId===item.id ? (
                      <input autoFocus value={item.text} onChange={e=>updateItemText(activeSection.id,item.id,e.target.value)} onBlur={()=>setEditingId(null)} onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")setEditingId(null);}} style={{ width:"100%", border:"none", outline:"none", fontSize:14, background:"transparent", color:"#1a1a1a", ...serif }} />
                    ) : (
                      <div onClick={()=>setEditingId(item.id)} style={{ fontSize:14, color:item.done?"#9ca3af":"#1a1a1a", textDecoration:item.done?"line-through":"none", cursor:"text", lineHeight:1.5 }}>
                        {item.text}
                        {item.tag && <span style={{ ...mono, fontSize:10, color:item.tag==="P0"?"#dc2626":item.tag==="P1"?"#d97706":"#2563eb", background:item.tag==="P0"?"#fee2e2":item.tag==="P1"?"#fef3c7":"#dbeafe", padding:"1px 6px", borderRadius:10, marginLeft:8 }}>{item.tag}</span>}
                      </div>
                    )}
                  </div>
                  <button className="del-btn" onClick={()=>removeItem(activeSection.id,item.id)} style={{ background:"none", border:"none", color:"#d1d5db", cursor:"pointer", fontSize:14, opacity:0, transition:"opacity 0.1s", padding:"0 2px", flexShrink:0 }}>×</button>
                </div>
              ))}
            </div>

            {/* Add item */}
            <div style={{ display:"flex", gap:7, marginBottom:28 }}>
              <input value={newItemText[activeSection.id]||""} onChange={e=>setNewItemText(p=>({...p,[activeSection.id]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")addItem(activeSection.id);}} placeholder={`Add item to ${activeSection.label}…`} style={{ flex:1, border:"1px solid #e5e7eb", borderRadius:7, padding:"8px 12px", fontSize:13, outline:"none", background:"#fff", color:"#1a1a1a", ...serif }} />
              <button className="add-btn" onClick={()=>addItem(activeSection.id)} style={{ background:"#f3f4f6", color:"#374151", border:"1px solid #e5e7eb", borderRadius:7, padding:"8px 14px", fontSize:11, cursor:"pointer", fontWeight:600, transition:"all 0.12s", ...mono }}>+ ADD</button>
            </div>

            {/* Section notes */}
            <div>
              <div style={{ ...mono, fontSize:9, color:"#9ca3af", letterSpacing:"0.1em", marginBottom:6 }}>SECTION NOTES</div>
              <textarea value={activeSection.notes} onChange={e=>updateSection(activeSection.id,{notes:e.target.value})} placeholder="Notes from this section…" rows={4} style={{ width:"100%", border:"1px solid #e5e7eb", borderRadius:8, padding:"10px 12px", fontSize:13, outline:"none", background:"#fff", color:"#374151", resize:"vertical", lineHeight:1.7, ...serif }} />
            </div>
          </div>
        )}
      </div>

      {/* Export modal */}
      {showExport && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div style={{ background:"#fff", borderRadius:12, padding:24, width:"100%", maxWidth:600, maxHeight:"85vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 64px rgba(0,0,0,0.2)", animation:"slideup 0.2s ease" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontSize:17, fontWeight:700 }}>Meeting Export</div>
              <button onClick={()=>setShowExport(false)} style={{ background:"none", border:"none", fontSize:20, cursor:"pointer", color:"#9ca3af" }}>×</button>
            </div>
            <textarea readOnly value={generateExport()} style={{ flex:1, border:"1px solid #e5e7eb", borderRadius:8, padding:"12px", fontSize:11, ...mono, color:"#374151", resize:"none", lineHeight:1.7, background:"#fafaf8", minHeight:300 }} />
            <div style={{ display:"flex", gap:8, marginTop:14 }}>
              <button onClick={()=>{ navigator.clipboard.writeText(generateExport()); }} style={{ flex:1, background:"#1a1a1a", color:"#fff", border:"none", borderRadius:7, padding:"10px", fontSize:11, cursor:"pointer", fontWeight:600, ...mono, letterSpacing:"0.04em" }}>COPY TO CLIPBOARD</button>
              <button onClick={()=>setShowExport(false)} style={{ background:"#f3f4f6", color:"#374151", border:"1px solid #e5e7eb", borderRadius:7, padding:"10px 18px", fontSize:11, cursor:"pointer", ...mono }}>CLOSE</button>
            </div>
          </div>
        </div>
      )}

      {/* New week confirm */}
      {showClear && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div style={{ background:"#fff", borderRadius:12, padding:28, width:"100%", maxWidth:400, boxShadow:"0 24px 64px rgba(0,0,0,0.2)" }}>
            <div style={{ fontSize:17, fontWeight:700, marginBottom:8 }}>Start New Week?</div>
            <p style={{ fontSize:13, color:"#6b7280", marginBottom:20, lineHeight:1.6 }}>This will clear all checked items, notes, and action items. The default agenda items will be restored. Make sure you've exported first.</p>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={clearMeeting} style={{ flex:1, background:"#1a1a1a", color:"#fff", border:"none", borderRadius:7, padding:"10px", fontSize:12, cursor:"pointer", fontWeight:600, ...mono }}>YES, CLEAR</button>
              <button onClick={()=>setShowClear(false)} style={{ background:"#f3f4f6", color:"#374151", border:"1px solid #e5e7eb", borderRadius:7, padding:"10px 18px", fontSize:12, cursor:"pointer", ...mono }}>CANCEL</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
