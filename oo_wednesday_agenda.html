function getMeetingDate() {
  const now=new Date(); const day=now.getDay(); const diff=day<=3?(3-day):(10-day);
  const next=new Date(now); next.setDate(now.getDate()+diff);
  return next.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}

// ── Storage helpers ────────────────────────────────────────────────────────
function loadTasks() { try{const s=localStorage.getItem(TASKS_KEY);return s?JSON.parse(s):DEFAULT_TASKS;}catch{return DEFAULT_TASKS;} }
function saveTasks(tasks) { try{localStorage.setItem(TASKS_KEY,JSON.stringify(tasks));}catch{} }
function loadPinned() { try{const s=localStorage.getItem(PINNED_KEY);return s?JSON.parse(s):[];}catch{return[];} }
function loadAgenda() { try{const s=localStorage.getItem(AGENDA_KEY);return s?JSON.parse(s):null;}catch{return null;} }
function loadCarried() { try{const s=localStorage.getItem("visiqua_carried_v2");if(!s)return [];const items=JSON.parse(s);localStorage.removeItem("visiqua_carried_v2");return items;}catch{return[];} }
function saveAgenda(data) { try{localStorage.setItem(AGENDA_KEY,JSON.stringify(data));}catch{} }

// Build focus items from pinned task GIDs + tracker tasks
function buildFocusItems(pinnedGids, tasks, existingItems) {
  // Debug: log what we have
  if (pinnedGids.length > 0 && tasks.length === 0) {
    console.warn('buildFocusItems: pinnedGids present but no tasks loaded');
  }
  // Keep manually added focus items (those without a gid)
  const manualItems = existingItems.filter(i => !i.fromTracker);
  // Build tracker-sourced items from pinned GIDs
  const trackerItems = pinnedGids.map(gid => {
    const task = tasks.find(t => t.gid===gid || t.id===gid);
    if (!task) return null;
    const existing = existingItems.find(i => i.trackerGid===gid);
    return {
      id: existing?.id || `tracker-${gid}`,
      text: task.name,
      done: existing?.done || task.status==="Done",
      tag: task.priority,
      trackerGid: gid,
      fromTracker: true,
      owner: task.owner || "",
      status: task.status,
    };
  }).filter(Boolean);
  return [...trackerItems, ...manualItems];
}

let nid = 500;

function App() {
  // Load shared tracker data
  const [trackerTasks, setTrackerTasks] = useState(loadTasks);
  const [pinnedGids, setPinnedGids]     = useState(loadPinned);

  // Load agenda-owned state
  const savedAgenda = loadAgenda();
  const [manualItems, setManualItems] = useState(() => {
    if (savedAgenda?.manualItems) return savedAgenda.manualItems;
    // Fresh load — check for carried items from last week
    const carried = loadCarried();
    const asanaItem = { id:"standing-asana", text:"Asana check-in — review last week's action items (done / in progress / blocked)", done:false, standingItem:true, carriedOver:false, fromTracker:false };
    const carriedMapped = carried.map((i, idx) => ({ ...i, id:"carried-"+idx, text:"[LAST WEEK] "+i.text, carriedOver:true, done:false }));
    return {
      ...DEFAULT_MANUAL_ITEMS,
      opening: [asanaItem, ...DEFAULT_MANUAL_ITEMS.opening],
      actions: carriedMapped,
    };
  });
  const [sectionNotes, setSectionNotes] = useState(savedAgenda?.sectionNotes || {});
  const [attendees, setAttendees]       = useState(savedAgenda?.attendees || "");
  const [meetingNotes, setMeetingNotes] = useState(savedAgenda?.meetingNotes || "");
  const [active, setActive]             = useState("opening");
  const [newItemText, setNewItemText]   = useState({});
  const [editingId, setEditingId]       = useState(null);
  const [showExport, setShowExport]     = useState(false);

  const [showClear, setShowClear]       = useState(false);
  const [lastSync, setLastSync]         = useState(null);
  const [toast, setToast]               = useState(null);

  function showToast(msg) { setToast(msg); setTimeout(()=>setToast(null),3000); }

  // Poll for tracker changes every 5 seconds (cross-tab sync)
  useEffect(() => {
    function syncFromTracker() {
      const newTasks  = loadTasks();
      const newPinned = loadPinned();
      const tasksChanged  = JSON.stringify(newTasks)  !== JSON.stringify(trackerTasks);
      const pinnedChanged = JSON.stringify(newPinned) !== JSON.stringify(pinnedGids);
      if (tasksChanged)  { setTrackerTasks(newTasks); }
      if (pinnedChanged) { setPinnedGids(newPinned); setLastSync(new Date()); showToast("📌 Focus items updated from tracker"); }
    }
    const interval = setInterval(syncFromTracker, 5000);
    // Also listen for storage events (other tabs)
    function onStorage(e) {
      if (e.key===TASKS_KEY&&e.newValue)  { try{setTrackerTasks(JSON.parse(e.newValue)); setLastSync(new Date());}catch{} }
      if (e.key===PINNED_KEY&&e.newValue) { try{setPinnedGids(JSON.parse(e.newValue));  setLastSync(new Date()); showToast("📌 Focus items updated from tracker");}catch{} }
    }
    window.addEventListener("storage", onStorage);
    return () => { clearInterval(interval); window.removeEventListener("storage", onStorage); };
  }, [trackerTasks, pinnedGids]);

  // Save agenda state whenever it changes
  useEffect(() => {
    saveAgenda({ manualItems, sectionNotes, attendees, meetingNotes, date:new Date().toDateString() });
  }, [manualItems, sectionNotes, attendees, meetingNotes]);

  // Build the focus section dynamically from pinned tracker items
  const focusItems = buildFocusItems(pinnedGids, trackerTasks, manualItems.focus || []);

  // When a focus item is checked, also update the tracker task status
  function toggleFocusItem(itemId) {
    const item = focusItems.find(i=>i.id===itemId);
    if (!item) return;
    const newDone = !item.done;
    // Update manual items
    setManualItems(prev => ({
      ...prev,
      focus: focusItems.map(i => i.id===itemId ? {...i, done:newDone} : i)
    }));
    // If it came from the tracker, write status back
    if (item.trackerGid && newDone) {
      const tasks = loadTasks();
      const updated = tasks.map(t => (t.gid===item.trackerGid||t.id===item.trackerGid) ? {...t, status:"Done"} : t);
      saveTasks(updated);
      setTrackerTasks(updated);
      showToast(`✓ Marked Done in tracker: ${item.text.slice(0,40)}…`);
    }
  }

  function getItems(sectionId) {
    if (sectionId==="focus") return focusItems;
    return manualItems[sectionId] || [];
  }

  function toggleItem(sectionId, itemId) {
    if (sectionId==="focus") { toggleFocusItem(itemId); return; }
    setManualItems(prev => ({ ...prev, [sectionId]: (prev[sectionId]||[]).map(i=>i.id===itemId?{...i,done:!i.done}:i) }));
  }
  function removeItem(sectionId, itemId) {
    if (sectionId==="focus") {
      setManualItems(prev => ({ ...prev, focus: focusItems.filter(i=>i.id!==itemId) }));
      return;
    }
    setManualItems(prev => ({ ...prev, [sectionId]: (prev[sectionId]||[]).filter(i=>i.id!==itemId) }));
  }
  function updateItemText(sectionId, itemId, text) {
    if (sectionId==="focus") {
      setManualItems(prev => ({ ...prev, focus: focusItems.map(i=>i.id===itemId?{...i,text}:i) }));
      return;
    }
    setManualItems(prev => ({ ...prev, [sectionId]: (prev[sectionId]||[]).map(i=>i.id===itemId?{...i,text}:i) }));
  }
  function addItem(sectionId) {
    const text=(newItemText[sectionId]||"").trim(); if(!text) return;
    const newI = { id:`n${nid++}`, text, done:false, fromTracker:false };
    if (sectionId==="focus") {
      setManualItems(prev => ({ ...prev, focus: [...focusItems, newI] }));
    } else {
      setManualItems(prev => ({ ...prev, [sectionId]: [...(prev[sectionId]||[]), newI] }));
    }
    setNewItemText(p=>({...p,[sectionId]:""}));
  }

  function clearMeeting() {
    // 1. Save carried items to their own localStorage key before wiping
    const prevActions = Array.isArray(manualItems.actions) ? manualItems.actions : [];
    const openActions = prevActions.filter(i => !i.done);
    try {
      localStorage.setItem("visiqua_carried_v2", JSON.stringify(openActions));
    } catch(e) {}

    // 2. Bump the agenda key so the page reloads with fresh defaults
    //    The useEffect on mount will pick up the carried items from visiqua_carried_v2
    try {
      localStorage.removeItem(AGENDA_KEY);
    } catch(e) {}

    // 3. Reload the page — cleanest possible reset
    setShowClear(false);
    window.location.reload();
  }

  // Live tracker stats for sidebar
  const trackerStats = {
    p0open: trackerTasks.filter(t=>t.priority==="P0"&&t.status!=="Done").length,
    inProgress: trackerTasks.filter(t=>t.status==="In Progress").length,
    pinned: pinnedGids.length,
  };

  const activeSection = SECTION_DEFS.find(s=>s.id===active);
  const totalDone = SECTION_DEFS.reduce((a,s)=>a+getItems(s.id).filter(i=>i.done).length,0);
  const totalItems = SECTION_DEFS.reduce((a,s)=>a+getItems(s.id).length,0);

  function generateExport() {
    const lines=[`VISIQUA — WEDNESDAY STATUS MEETING`,getMeetingDate(),attendees?`Attendees: ${attendees}`:"","","─".repeat(60)];
    SECTION_DEFS.forEach(s=>{
      const items=getItems(s.id);
      lines.push("",`${s.icon}  ${s.label.toUpperCase()}  [${s.timebox}]`,"─".repeat(40));
      items.forEach(i=>{const tag=i.tag?` [${i.tag}]`:"";const owner=i.owner?` 👤${i.owner}`:"";lines.push(`  ${i.done?"✓":"○"} ${i.text}${tag}${owner}`);});
      if(sectionNotes[s.id]) lines.push("",`  Notes: ${sectionNotes[s.id]}`);
    });
    if(meetingNotes) lines.push("","─".repeat(60),"GENERAL NOTES",meetingNotes);
    const actions=getItems("actions");
    if(actions.length){lines.push("","─".repeat(60),"ACTION ITEMS — PUSH TO ASANA");actions.forEach((i,n)=>lines.push(`  ${n+1}. ${i.text}`));}
    return lines.join("\n");
  }

  function generateSummaryExport() {
    const lines = [];
    lines.push(`Please write a clean Wednesday status meeting recap for the Visiqua team, ready to send via Slack or email.`);
    lines.push(`Meeting: ${getMeetingDate()}`);
    if (attendees) lines.push(`Attendees: ${attendees}`);
    lines.push("");
    lines.push("Here is the meeting data:");
    lines.push("");
    SECTION_DEFS.forEach(s => {
      const items = getItems(s.id);
      const covered = items.filter(i=>i.done).map(i=>`  ✓ ${i.text}${i.tag?" ["+i.tag+"]":""}`);
      const uncovered = items.filter(i=>!i.done).map(i=>`  ○ ${i.text}`);
      const notes = sectionNotes[s.id] || "";
      if (!covered.length && !uncovered.length && !notes) return;
      lines.push(`${s.icon} ${s.label.toUpperCase()}`);
      if (notes) lines.push(`Notes: ${notes}`);
      if (covered.length) { lines.push("Covered:"); covered.forEach(l=>lines.push(l)); }
      if (uncovered.length) { lines.push("Not covered:"); uncovered.forEach(l=>lines.push(l)); }
      lines.push("");
    });
    lines.push("---");
    lines.push("Format the recap with:");
    lines.push("- Clean header with date");
    lines.push("- Short summary per section that had meaningful content (skip empty ones)");
    lines.push("- Clear Action Items section at the end");
    lines.push("- Scannable in under 60 seconds, plain text, ALL CAPS section names");
    lines.push("- Direct, professional, internal team tone");
    return lines.join("\n");
  }



  const mono={fontFamily:"'JetBrains Mono',monospace"};
  const serif={fontFamily:"'Spectral',Georgia,serif"};

  return (
    <div style={{minHeight:"100vh",background:"#fafaf8",...serif,color:"#1a1a1a"}}>
      {toast&&<div style={{position:"fixed",top:16,right:16,zIndex:999,background:"#1a1a1a",color:"#fff",borderRadius:8,padding:"10px 16px",fontSize:12,boxShadow:"0 4px 20px rgba(0,0,0,0.3)",maxWidth:360,animation:"fadein 0.2s ease"}}>{toast}</div>}

      {/* Top bar */}
      <div style={{background:"#1a1a1a",color:"#fff",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:50}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{...mono,fontSize:10,color:"#6b7280",letterSpacing:"0.12em"}}>VISIQUA</div>
          <div style={{width:1,height:14,background:"#374151"}}/>
          <div style={{fontSize:14,fontWeight:600}}>Wednesday Status Meeting</div>
          <div style={{...mono,fontSize:10,color:"#6b7280"}}>{getMeetingDate()}</div>
          {lastSync&&<div style={{...mono,fontSize:9,color:"#4ade80"}}>● synced {lastSync.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{...mono,fontSize:10,color:"#6b7280"}}>{totalDone}/{totalItems}</div>
          <div style={{width:72,height:3,background:"#374151",borderRadius:2}}>
            <div style={{width:`${totalItems?(totalDone/totalItems)*100:0}%`,height:"100%",background:"#10b981",borderRadius:2,transition:"width 0.3s"}}/>
          </div>
          <button onClick={()=>setShowClear(true)} style={{...mono,background:"transparent",color:"#6b7280",border:"1px solid #374151",borderRadius:5,padding:"4px 10px",fontSize:10,cursor:"pointer",letterSpacing:"0.06em"}}>NEW WEEK</button>
          <button onClick={()=>setShowExport(true)} style={{...mono,background:"transparent",color:"#9ca3af",border:"1px solid #374151",borderRadius:5,padding:"4px 10px",fontSize:10,cursor:"pointer",letterSpacing:"0.06em"}}>EXPORT</button>
          <button onClick={()=>{ navigator.clipboard.writeText(generateSummaryExport()); setToast("Copied! Paste into Claude chat for your recap ✓"); }} style={{...mono,background:"#10b981",color:"#fff",border:"none",borderRadius:5,padding:"4px 12px",fontSize:10,cursor:"pointer",letterSpacing:"0.06em",fontWeight:600}}>✉ COPY FOR SUMMARY</button>
        </div>
      </div>

      <div style={{display:"flex",height:"calc(100vh - 50px)"}}>
        {/* Sidebar */}
        <div style={{width:220,borderRight:"1px solid #e5e7eb",background:"#fff",padding:"14px 0",display:"flex",flexDirection:"column"}}>

          {/* Dashboards */}
          <div style={{padding:"0 14px 12px",borderBottom:"1px solid #f3f4f6"}}>
            <div style={{...mono,fontSize:9,color:"#9ca3af",letterSpacing:"0.1em",marginBottom:8}}>DASHBOARDS</div>
            {[{label:"O&O Task Tracker",color:"#4f46e5",url:TRACKER_URL},{label:"ACT Agent Dashboard",color:"#059669",url:AGENT_URL},{label:"O&O Channel Dashboard",color:"#2563eb",url:CHANNEL_URL}].map(t=>(
              <a key={t.label} href={t.url} target="_blank" className="tool-chip" style={{display:"flex",alignItems:"center",gap:7,padding:"5px 6px",borderRadius:5,marginBottom:2}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:t.color,flexShrink:0}}/>
                <span style={{...mono,fontSize:10,color:t.color,fontWeight:500}}>{t.label} ↗</span>
              </a>
            ))}
          </div>

          {/* Live tracker stats */}
          <div style={{padding:"10px 14px",borderBottom:"1px solid #f3f4f6",background:"#f9fafb"}}>
            <div style={{...mono,fontSize:9,color:"#9ca3af",letterSpacing:"0.1em",marginBottom:6}}>LIVE FROM TRACKER</div>
            <div style={{display:"flex",gap:8}}>
              {[{l:"📌 Pinned",v:trackerStats.pinned,c:"#d97706"},{l:"P0 Open",v:trackerStats.p0open,c:"#dc2626"},{l:"Active",v:trackerStats.inProgress,c:"#2563eb"}].map(s=>(
                <div key={s.l} style={{flex:1,textAlign:"center"}}>
                  <div style={{...mono,fontSize:16,fontWeight:700,color:s.c}}>{s.v}</div>
                  <div style={{...mono,fontSize:8,color:"#9ca3af"}}>{s.l}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Agenda nav */}
          <div style={{flex:1,overflowY:"auto",padding:"8px 0"}}>
            <div style={{...mono,padding:"0 14px 5px",fontSize:9,color:"#9ca3af",letterSpacing:"0.1em"}}>AGENDA</div>
            {SECTION_DEFS.map(s=>{
              const items=getItems(s.id);
              const done=items.filter(i=>i.done).length;
              const isActive=active===s.id;
              const hasPinned=s.id==="focus"&&pinnedGids.length>0;
              return (
                <div key={s.id} className={`nav-item${isActive?" active-nav":""}`} onClick={()=>setActive(s.id)} style={{padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",borderLeft:isActive?`3px solid ${s.color}`:"3px solid transparent",transition:"all 0.12s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:7}}>
                    <span style={{fontSize:12}}>{s.icon}</span>
                    <div>
                      <div style={{fontSize:12,fontWeight:600}}>{s.label}</div>
                      <div style={{...mono,fontSize:8,color:isActive?"#9ca3af":"#9ca3af",marginTop:1}}>{s.timebox}{hasPinned?` · ${pinnedGids.length} pinned`:""}</div>
                    </div>
                  </div>
                  {items.length>0&&<div style={{...mono,fontSize:10,color:isActive?"#9ca3af":"#9ca3af",flexShrink:0}}>{done}/{items.length}</div>}
                </div>
              );
            })}
          </div>

          {/* Attendees */}
          <div style={{padding:"10px 14px",borderTop:"1px solid #f3f4f6"}}>
            <div style={{...mono,fontSize:9,color:"#9ca3af",letterSpacing:"0.1em",marginBottom:5}}>ATTENDEES</div>
            <textarea value={attendees} onChange={e=>setAttendees(e.target.value)} placeholder="Names…" rows={2} style={{width:"100%",fontSize:11,border:"1px solid #e5e7eb",borderRadius:5,padding:"5px 7px",color:"#374151",outline:"none",background:"#fafaf8",resize:"none",...serif}}/>
          </div>
        </div>

        {/* Main content */}
        {activeSection&&(
          <div key={activeSection.id} style={{flex:1,overflowY:"auto",padding:"26px 34px",animation:"fadein 0.2s ease"}}>

            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:22}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:5}}>
                  <span style={{fontSize:20}}>{activeSection.icon}</span>
                  <h1 style={{fontSize:23,fontWeight:700,letterSpacing:"-0.02em"}}>{activeSection.label}</h1>
                  <span style={{...mono,fontSize:10,color:"#9ca3af",background:"#f3f4f6",padding:"3px 8px",borderRadius:4}}>{activeSection.timebox}</span>
                </div>
                <p style={{fontSize:13,color:"#6b7280",fontStyle:"italic"}}>{activeSection.description}</p>
                {activeSection.id==="focus"&&pinnedGids.length>0&&(
                  <div style={{...mono,fontSize:10,color:"#d97706",marginTop:5}}>📌 {pinnedGids.length} items auto-loaded from tracker · <a href={TRACKER_URL} target="_blank" style={{color:"#4f46e5"}}>pin more ↗</a></div>
                )}
                {activeSection.id==="focus"&&pinnedGids.length===0&&(
                  <div style={{...mono,fontSize:10,color:"#9ca3af",marginTop:5}}>No pins yet · <a href={TRACKER_URL} target="_blank" style={{color:"#4f46e5"}}>open tracker to pin items ↗</a></div>
                )}
                {activeSection.tool&&activeSection.toolUrl&&activeSection.id!=="focus"&&(
                  <div style={{marginTop:8,display:"flex",alignItems:"center",gap:6}}>
                    <span style={{...mono,fontSize:9,color:"#9ca3af"}}>TOOL →</span>
                    <a href={activeSection.toolUrl} target="_blank" style={{...mono,fontSize:10,color:activeSection.color,background:activeSection.bg,padding:"3px 10px",borderRadius:4,border:`1px solid ${activeSection.border}`,fontWeight:500}}>{activeSection.tool} ↗</a>
                  </div>
                )}
              </div>
              <div style={{...mono,fontSize:11,color:"#9ca3af",textAlign:"right",flexShrink:0,marginLeft:20}}>
                {getItems(activeSection.id).filter(i=>i.done).length} / {getItems(activeSection.id).length}<br/><span style={{fontSize:9}}>covered</span>
              </div>
            </div>

            <div style={{height:1,background:`linear-gradient(to right, ${activeSection.color}55, transparent)`,marginBottom:18}}/>

            {/* Items */}
            <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:18}}>
              {getItems(activeSection.id).map(item=>(
                <div key={item.id} className="item-row" style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 12px",background:item.done?"#f9fafb":"#fff",border:`1px solid ${item.done?"#f3f4f6":"#e5e7eb"}`,borderRadius:7,transition:"all 0.12s",borderLeft:item.done?"3px solid #10b981":`3px solid ${activeSection.color}`}}>
                  <button className="check-btn" onClick={()=>toggleItem(activeSection.id,item.id)} style={{width:17,height:17,borderRadius:4,border:`1.5px solid ${item.done?"#10b981":"#d1d5db"}`,background:item.done?"#10b981":"transparent",cursor:"pointer",flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.12s"}}>
                    {item.done&&<span style={{color:"#fff",fontSize:9,lineHeight:1}}>✓</span>}
                  </button>
                  <div style={{flex:1}}>
                    {editingId===item.id?(
                      <input autoFocus value={item.text} onChange={e=>updateItemText(activeSection.id,item.id,e.target.value)} onBlur={()=>setEditingId(null)} onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")setEditingId(null);}} style={{width:"100%",border:"none",outline:"none",fontSize:14,background:"transparent",color:"#1a1a1a",...serif}}/>
                    ):(
                      <div onClick={()=>setEditingId(item.id)} style={{fontSize:14,color:item.done?"#9ca3af":"#1a1a1a",textDecoration:item.done?"line-through":"none",cursor:"text",lineHeight:1.5}}>
                        {item.text}
                        {item.tag&&<span style={{...mono,fontSize:10,color:PRIORITY_META[item.tag]?.color||"#6b7280",background:PRIORITY_META[item.tag]?.bg||"#f3f4f6",padding:"1px 6px",borderRadius:10,marginLeft:8}}>{item.tag}</span>}
                        {item.owner&&<span style={{...mono,fontSize:9,color:"#6b7280",marginLeft:6}}>👤{item.owner}</span>}
                        {item.fromTracker&&<span style={{...mono,fontSize:9,color:"#4f46e5",background:"#eef2ff",padding:"1px 5px",borderRadius:4,marginLeft:6}}>tracker</span>}
                        {item.carriedOver&&<span style={{...mono,fontSize:9,color:"#d97706",background:"#fef3c7",padding:"1px 6px",borderRadius:4,marginLeft:6}}>↩ carried</span>}
                        {item.standingItem&&<span style={{...mono,fontSize:9,color:"#059669",background:"#d1fae5",padding:"1px 6px",borderRadius:4,marginLeft:6}}>standing</span>}
                      </div>
                    )}
                  </div>
                  <button className="del-btn" onClick={()=>removeItem(activeSection.id,item.id)} style={{background:"none",border:"none",color:"#d1d5db",cursor:"pointer",fontSize:14,opacity:0,transition:"opacity 0.1s",padding:"0 2px",flexShrink:0}}>×</button>
                </div>
              ))}
            </div>

            {/* Add item */}
            <div style={{display:"flex",gap:7,marginBottom:26}}>
              <input value={newItemText[activeSection.id]||""} onChange={e=>setNewItemText(p=>({...p,[activeSection.id]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")addItem(activeSection.id);}} placeholder={activeSection.id==="focus"?"Add item manually (or pin from tracker)…":`Add item to ${activeSection.label}…`} style={{flex:1,border:"1px solid #e5e7eb",borderRadius:7,padding:"8px 12px",fontSize:13,outline:"none",background:"#fff",color:"#1a1a1a",...serif}}/>
              <button className="add-btn" onClick={()=>addItem(activeSection.id)} style={{background:"#f3f4f6",color:"#374151",border:"1px solid #e5e7eb",borderRadius:7,padding:"8px 14px",fontSize:11,cursor:"pointer",fontWeight:600,transition:"all 0.12s",...mono}}>+ ADD</button>
            </div>

            {/* Section notes */}
            <div>
              <div style={{...mono,fontSize:9,color:"#9ca3af",letterSpacing:"0.1em",marginBottom:6}}>SECTION NOTES</div>
              <textarea value={sectionNotes[activeSection.id]||""} onChange={e=>setSectionNotes(p=>({...p,[activeSection.id]:e.target.value}))} placeholder="Notes from this section…" rows={4} style={{width:"100%",border:"1px solid #e5e7eb",borderRadius:8,padding:"10px 12px",fontSize:13,outline:"none",background:"#fff",color:"#374151",resize:"vertical",lineHeight:1.7,...serif}}/>
            </div>
          </div>
        )}
      </div>

      {/* Export modal */}
      {showExport&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:12,padding:24,width:"100%",maxWidth:600,maxHeight:"85vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 64px rgba(0,0,0,0.2)",animation:"slideup 0.2s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontSize:17,fontWeight:700}}>Meeting Export</div>
              <button onClick={()=>setShowExport(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#9ca3af"}}>×</button>
            </div>
            <textarea readOnly value={generateExport()} style={{flex:1,border:"1px solid #e5e7eb",borderRadius:8,padding:"12px",fontSize:11,...mono,color:"#374151",resize:"none",lineHeight:1.7,background:"#fafaf8",minHeight:300}}/>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button onClick={()=>navigator.clipboard.writeText(generateExport())} style={{flex:1,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:7,padding:"10px",fontSize:11,cursor:"pointer",fontWeight:600,...mono,letterSpacing:"0.04em"}}>COPY TO CLIPBOARD</button>
              <button onClick={()=>setShowExport(false)} style={{background:"#f3f4f6",color:"#374151",border:"1px solid #e5e7eb",borderRadius:7,padding:"10px 18px",fontSize:11,cursor:"pointer",...mono}}>CLOSE</button>
            </div>
          </div>
        </div>
      )}



      {/* New week confirm */}
      {showClear&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:12,padding:28,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.2)"}}>
            <div style={{fontSize:17,fontWeight:700,marginBottom:16}}>Start New Week?</div>

            {/* Pre-clear checklist */}
            <div style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:"14px 16px",marginBottom:20}}>
              <div style={{...mono,fontSize:10,color:"#9ca3af",letterSpacing:"0.08em",marginBottom:10}}>BEFORE YOU CLEAR — CONFIRM:</div>
              {[
                { id:"c1", text:"Recap email sent to the team" },
                { id:"c2", text:"Action items pushed to Asana" },
                { id:"c3", text:"Opening updated with this week's announcements" },
                { id:"c4", text:"Tracker pins updated for this week's focus items" },
              ].map(item => {
                const [checked, setChecked] = React.useState(false);
                return (
                  <div key={item.id} onClick={()=>setChecked(!checked)} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",cursor:"pointer",borderBottom:"1px solid #f3f4f6"}}>
                    <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${checked?"#10b981":"#d1d5db"}`,background:checked?"#10b981":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.12s"}}>
                      {checked&&<span style={{color:"#fff",fontSize:9,lineHeight:1}}>✓</span>}
                    </div>
                    <span style={{fontSize:13,color:checked?"#9ca3af":"#374151",textDecoration:checked?"line-through":"none",transition:"all 0.12s"}}>{item.text}</span>
                  </div>
                );
              })}
            </div>

            {(manualItems.actions||[]).filter(i=>!i.done).length > 0 && (
              <div style={{background:"#fef3c7",border:"1px solid #fbbf24",borderRadius:7,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14}}>⚠️</span>
                <span style={{fontSize:12,color:"#92400e"}}>
                  <strong>{(manualItems.actions||[]).filter(i=>!i.done).length} unchecked action item{(manualItems.actions||[]).filter(i=>!i.done).length>1?"s":""}</strong> will carry forward to next week automatically.
                </span>
              </div>
            )}
            {(manualItems.actions||[]).filter(i=>!i.done).length === 0 && (manualItems.actions||[]).length > 0 && (
              <div style={{background:"#d1fae5",border:"1px solid #6ee7b7",borderRadius:7,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14}}>🎉</span>
                <span style={{fontSize:12,color:"#065f46"}}><strong>All action items completed</strong> — clean slate for next week.</span>
              </div>
            )}
            <p style={{fontSize:12,color:"#9ca3af",marginBottom:16,lineHeight:1.5}}>Checked items and notes will be cleared. Unchecked action items carry forward automatically. Pinned tracker items stay pinned.</p>
            <div style={{display:"flex",gap:8}}>
              <button onClick={clearMeeting} style={{flex:1,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:7,padding:"10px",fontSize:12,cursor:"pointer",fontWeight:600,...mono}}>YES, CLEAR FOR NEW WEEK</button>
              <button onClick={()=>setShowClear(false)} style={{background:"#f3f4f6",color:"#374151",border:"1px solid #e5e7eb",borderRadius:7,padding:"10px 18px",fontSize:12,cursor:"pointer",...mono}}>CANCEL</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
